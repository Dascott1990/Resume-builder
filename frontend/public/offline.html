<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Noviq</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0a; color: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 18px; font-weight: 700; margin: 16px 0 6px; }
  p { font-size: 13.5px; color: #a3a3a3; max-width: 280px; line-height: 1.5; margin: 0 0 20px; }
  button { border: none; background: #f59e0b; color: #1c1206; font-weight: 700; font-size: 14px; padding: 12px 22px; border-radius: 12px; }
</style>
</head>
<body>
  <div class="wrap">
    <svg viewBox="0 0 100 100" width="44" height="44" role="img" aria-label="NOVIQ">
      <defs>
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#F6E6B3" />
          <stop offset="38%" stop-color="#f59e0b" />
          <stop offset="100%" stop-color="#5C4419" />
        </linearGradient>
        <clipPath id="clip">
          <path d="M 22 90 L 22 52 L 78 10 L 78 90" fill="none" stroke="#000" stroke-width="16" stroke-linecap="butt" stroke-linejoin="round" />
        </clipPath>
      </defs>
      <g clip-path="url(#clip)">
        <rect x="0" y="0" width="100" height="100" fill="url(#body)" />
      </g>
    </svg>
    <h1 id="heading">You're offline</h1>
    <p id="message">Noviq needs a connection to build and tailor resumes. Reconnect and try again.</p>
    <div style="display:flex; gap:10px;">
      <button onclick="location.reload()">Retry</button>
      <a id="open-app" href="/" style="display:none; border:1px solid #f59e0b; color:#f59e0b; text-decoration:none; font-weight:700; font-size:14px; padding:11px 22px; border-radius:12px;">Open Noviq</a>
    </div>
  </div>
  <script>
    // This static page can't render the draft itself (that's the real app's
    // job, and keeping two copies of "what a draft looks like" in sync would
    // be a maintenance trap) — but it CAN check whether one exists and point
    // back at "/", which the service worker may well be able to serve from
    // its own cache even though this particular static file is what got
    // served for whatever URL was actually requested. Key must match
    // guest/useGuestDraft.js's DRAFT_KEY exactly.
    try {
      if (localStorage.getItem("resumeBuilder:draft:v1")) {
        document.getElementById("heading").textContent = "You have a saved draft";
        document.getElementById("message").textContent = "This device has an in-progress resume. Reconnect, or open Noviq to keep working on it.";
        document.getElementById("open-app").style.display = "inline-block";
      }
    } catch (e) { /* localStorage inaccessible (private mode etc.) — leave the generic message */ }
  </script>
</body>
</html>
