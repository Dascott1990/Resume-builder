services:
  - type: web
    name: resume-builder-backend
    runtime: python
    # `--with-deps` pulls the system libraries headless Chromium needs
    # (Render's native Python runtime doesn't have them by default).
    #
    # Confirmed by an actual production failure: without PLAYWRIGHT_BROWSERS_PATH
    # set below, Playwright installs the browser into the DEFAULT cache dir
    # (~/.cache/ms-playwright), which lives outside whatever Render actually
    # persists from the build step into the running container — the build
    # step succeeds, but every later `chromium.launch()` at runtime fails with
    # "Executable doesn't exist," because the binary that build step
    # downloaded is already gone by the time a real request runs. Pointing
    # PLAYWRIGHT_BROWSERS_PATH at a path inside the project directory (which
    # Render DOES carry over) makes the build and the running app agree on
    # where the browser actually lives.
    # ffmpeg (for /brand's story-assembly render job, see api/story.py) is
    # installed the same way Chromium's system deps above already are —
    # apt-get during this build step, proven to work on Render's native
    # Python runtime by the Playwright line above it.
    buildCommand: pip install -r requirements.txt && playwright install --with-deps chromium && apt-get update && apt-get install -y ffmpeg
    # --timeout 120: POST /api/v1/brand/story/render (api/story.py) does its
    # ffmpeg encoding synchronously inside the request — deliberately, so it
    # never depends on the database (see that file's module docstring) —
    # rather than gunicorn's sync-worker default of 30s, which a multi-clip
    # render could plausibly exceed. Render's own reverse proxy may still
    # impose a shorter hard ceiling this setting can't override; if large
    # story renders start timing out in production, that's the sign this
    # needs to become an async job again.
    startCommand: gunicorn run:app --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resume-db
          property: connectionString
      - key: CLAUDE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://resume-builder-orpin-theta.vercel.app,https://resume-builder-c6l75mdzi-dascott1990s-projects.vercel.app,http://localhost:3000
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/.playwright

  - type: postgresql
    name: resume-db
    plan: starter