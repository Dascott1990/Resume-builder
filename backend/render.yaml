services:
  - type: web
    name: resume-builder-backend
    runtime: python
    # `--with-deps` pulls the system libraries headless Chromium needs
    # (Render's native Python runtime doesn't have them by default) —
    # this is the one part of the whole Apply-with-AI feature that's
    # genuinely unverified until an actual deploy: it works locally, but
    # whether Render's build step has enough permission to install those
    # system packages hasn't been tested. If this build step fails, that's
    # the reason — see the plan doc's explicit "spike this first" note.
    buildCommand: pip install -r requirements.txt && playwright install --with-deps chromium
    startCommand: gunicorn run:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resume-db
          property: connectionString
      - key: CLAUDE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://resume-builder-orpin-theta.vercel.app,https://resume-builder-c6l75mdzi-dascott1990s-projects.vercel.app,http://localhost:3000
      - key: PYTHON_VERSION
        value: 3.11.0

  - type: postgresql
    name: resume-db
    plan: starter