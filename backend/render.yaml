services:
  - type: web
    name: resume-builder-backend
    runtime: python
    # `--with-deps` pulls the system libraries headless Chromium needs
    # (Render's native Python runtime doesn't have them by default).
    #
    # Confirmed by an actual production failure: without PLAYWRIGHT_BROWSERS_PATH
    # set below, Playwright installs the browser into the DEFAULT cache dir
    # (~/.cache/ms-playwright), which lives outside whatever Render actually
    # persists from the build step into the running container — the build
    # step succeeds, but every later `chromium.launch()` at runtime fails with
    # "Executable doesn't exist," because the binary that build step
    # downloaded is already gone by the time a real request runs. Pointing
    # PLAYWRIGHT_BROWSERS_PATH at a path inside the project directory (which
    # Render DOES carry over) makes the build and the running app agree on
    # where the browser actually lives.
    # ffmpeg and espeak-ng (for /brand's story-assembly render job — video
    # encoding and voice-over narration, see api/story.py) are installed
    # the same way Chromium's system deps above already are — apt-get
    # during this build step, proven to work on Render's native Python
    # runtime by the Playwright line above it. espeak-ng specifically:
    # free/offline TTS, chosen over a paid neural voice API to avoid a
    # new vendor credential — synthetic-sounding is the accepted tradeoff.
    buildCommand: pip install -r requirements.txt && playwright install --with-deps chromium && apt-get update && apt-get install -y ffmpeg espeak-ng
    # That prediction came true: a real production render took 30+
    # seconds and got cut off by Render's own platform-level reverse
    # proxy before this --timeout 120 ever applied, surfacing as an
    # opaque 502 with an empty body. POST /api/v1/brand/story/render
    # (api/story.py) is async now — the request just starts a background
    # job and returns almost immediately, so this --timeout is no longer
    # load-bearing for the render itself (kept anyway as a sane ceiling
    # for any request).
    #
    # --workers 2, not gunicorn's default of 1: with one worker, ANY slow
    # request — not just a render, though that was the one that actually
    # surfaced it — blocks every other request on this service, including
    # completely unrelated traffic, until it finishes or the platform
    # gives up on it. Two is a deliberately modest bump (not 4+): each
    # worker is a full process carrying this app's own import weight
    # (SQLAlchemy, Playwright, etc.), and this service's actual RAM
    # budget isn't something this file can see — revisit upward only
    # after confirming headroom on the real instance.
    startCommand: gunicorn run:app --timeout 120 --workers 2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resume-db
          property: connectionString
      - key: CLAUDE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://resume-builder-orpin-theta.vercel.app,https://resume-builder-c6l75mdzi-dascott1990s-projects.vercel.app,http://localhost:3000
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/.playwright

  - type: postgresql
    name: resume-db
    plan: starter